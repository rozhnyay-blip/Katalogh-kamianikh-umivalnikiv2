openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Public catalog and owner product management.
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: site-content
    description: Public site copy and owner-only editing.
paths:
  /owner/status:
    get:
      operationId: getOwnerStatus
      summary: Check the authenticated account's owner access
      responses:
        "200":
          description: Access status (no private account information)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerStatus"
  /site-content:
    get:
      operationId: getSiteContent
      tags: [site-content]
      summary: Get the public site content
      responses:
        "200":
          description: Current site content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"
    put:
      operationId: updateSiteContent
      tags: [site-content]
      summary: Replace the public site content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteContentUpdate"
      responses:
        "200":
          description: Saved site content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"
        "400":
          description: Invalid site content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders:
    post:
      operationId: createOrder
      summary: Submit a product enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Enquiry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderReceipt"
        "400":
          description: Invalid enquiry
        "404":
          description: Product not available
    get:
      operationId: listOrders
      summary: Owner-only enquiry inbox
      responses:
        "200":
          description: Received enquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Sign in required
        "403":
          description: Owner only
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List catalog products
      responses:
        "200":
          description: Catalog products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a catalog product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a catalog product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a catalog product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Product deleted
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /products/{id}/photos:
    post:
      operationId: appendProductPhotos
      tags: [products]
      summary: Append photos to a catalog product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPhotosInput"
      responses:
        "200":
          description: Product with appended photos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid photo paths.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Product already has the maximum number of photos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve a catalog image
      parameters:
        - name: objectPath
          in: path
          required: true
          description: Relative path after /objects/, for example uploads/UUID. Do not pass the full normalized database path returned by upload creation.
          schema:
            type: string
            pattern: '^uploads/[0-9a-fA-F-]{36}$'
        - name: width
          in: query
          required: false
          description: Optional responsive image width. When omitted, the verified original is streamed unchanged.
          schema:
            type: integer
            enum: [480, 960, 1440, 1920, 3840]
      responses:
        "200":
          description: Verified original content streamed unchanged, or a
            responsive WebP variant when width is provided.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "400":
          description: Invalid responsive image width.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Responsive image processing is temporarily overloaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, name, subtitle, price, kind, images, available]
      properties:
        available:
          type: boolean
        id:
          type: integer
        name:
          type: string
        subtitle:
          type: string
        price:
          type: string
        kind:
          type: string
        images:
          type: array
          maxItems: 10
          items:
            type: string
    ProductInput:
      type: object
      required: [name, subtitle, price, kind, images, available]
      properties:
        available:
          type: boolean
        name:
          type: string
          minLength: 1
        subtitle:
          type: string
          minLength: 1
        price:
          type: string
          minLength: 1
        kind:
          type: string
          minLength: 1
        images:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1
    ProductUpdate:
      type: object
      properties:
        available:
          type: boolean
        name:
          type: string
          minLength: 1
        subtitle:
          type: string
          minLength: 1
        price:
          type: string
          minLength: 1
        kind:
          type: string
          minLength: 1
        images:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1
    ProductPhotosInput:
      type: object
      required: [images]
      additionalProperties: false
      properties:
        images:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            pattern: '^/objects/uploads/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
          maximum: 10485760
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
          description: Normalized database path /objects/uploads/UUID. Fetch by prepending /api/storage to this full value, or remove /objects/ before passing it to getStorageObject.
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    OwnerStatus:
      type: object
      required: [signedIn, isOwner]
      properties:
        signedIn:
          type: boolean
        isOwner:
          type: boolean
    SiteContent:
      type: object
      required: [topline, nav, contact, hero, marquee, story, catalog, details, footer]
      properties:
        topline:
          $ref: "#/components/schemas/SiteTopline"
        nav:
          $ref: "#/components/schemas/SiteNav"
        contact:
          $ref: "#/components/schemas/SiteContact"
        hero:
          $ref: "#/components/schemas/SiteHero"
        marquee:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 100
        story:
          $ref: "#/components/schemas/SiteStory"
        catalog:
          $ref: "#/components/schemas/SiteCatalog"
        details:
          $ref: "#/components/schemas/SiteDetails"
        footer:
          $ref: "#/components/schemas/SiteFooter"
    SiteContentUpdate:
      allOf:
        - $ref: "#/components/schemas/SiteContent"
    SiteTopline:
      type: object
      required: [tagline, note]
      properties:
        tagline: { type: string, minLength: 1, maxLength: 160 }
        note: { type: string, minLength: 1, maxLength: 160 }
    SiteNav:
      type: object
      required: [catalog, story, details, instagramUrl]
      properties:
        catalog: { type: string, minLength: 1, maxLength: 80 }
        story: { type: string, minLength: 1, maxLength: 80 }
        details: { type: string, minLength: 1, maxLength: 80 }
        instagramUrl: { type: string, format: uri, pattern: '^https://www\.instagram\.com/' }
    SiteContact:
      type: object
      required: [label, phone, viberLabel, whatsappLabel, instagramLabel]
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: string, minLength: 5, maxLength: 40 }
        viberLabel: { type: string, minLength: 1, maxLength: 60 }
        whatsappLabel: { type: string, minLength: 1, maxLength: 60 }
        instagramLabel: { type: string, minLength: 1, maxLength: 60 }
    SiteHero:
      type: object
      required: [eyebrow, titleLead, titleMiddle, titleEmphasis, lede, primaryCta, secondaryCta, visualAria, visualIndex, stampLine1, stampLine2, stampLine3, price, dimensions, weight, orderCta]
      properties:
        eyebrow: { type: string, minLength: 1, maxLength: 120 }
        titleLead: { type: string, minLength: 1, maxLength: 120 }
        titleMiddle: { type: string, minLength: 1, maxLength: 120 }
        titleEmphasis: { type: string, minLength: 1, maxLength: 120 }
        lede: { type: string, minLength: 1, maxLength: 500 }
        primaryCta: { type: string, minLength: 1, maxLength: 100 }
        secondaryCta: { type: string, minLength: 1, maxLength: 100 }
        visualAria: { type: string, minLength: 1, maxLength: 200 }
        visualIndex: { type: string, minLength: 1, maxLength: 80 }
        stampLine1: { type: string, minLength: 1, maxLength: 40 }
        stampLine2: { type: string, minLength: 1, maxLength: 80 }
        stampLine3: { type: string, minLength: 1, maxLength: 80 }
        price: { type: string, minLength: 1, maxLength: 80 }
        dimensions: { type: string, minLength: 1, maxLength: 80 }
        weight: { type: string, minLength: 1, maxLength: 80 }
        orderCta: { type: string, minLength: 1, maxLength: 100 }
    SiteProcessStep:
      type: object
      required: [number, title, description]
      properties:
        number: { type: string, minLength: 1, maxLength: 40 }
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 500 }
    SiteStory:
      type: object
      required: [eyebrow, titleLead, titleEmphasis, copy, note, steps]
      properties:
        eyebrow: { type: string, minLength: 1, maxLength: 120 }
        titleLead: { type: string, minLength: 1, maxLength: 120 }
        titleEmphasis: { type: string, minLength: 1, maxLength: 120 }
        copy: { type: string, minLength: 1, maxLength: 900 }
        note: { type: string, minLength: 1, maxLength: 400 }
        steps:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/SiteProcessStep"
    SiteCatalog:
      type: object
      required: [eyebrow, titleLead, titleEmphasis, intro, ownerToolbarTitle, ownerToolbarHelp, addProductLabel, emptyMessage, emptyAddLabel]
      properties:
        eyebrow: { type: string, minLength: 1, maxLength: 120 }
        titleLead: { type: string, minLength: 1, maxLength: 120 }
        titleEmphasis: { type: string, minLength: 1, maxLength: 120 }
        intro: { type: string, minLength: 1, maxLength: 500 }
        ownerToolbarTitle: { type: string, minLength: 1, maxLength: 160 }
        ownerToolbarHelp: { type: string, minLength: 1, maxLength: 240 }
        addProductLabel: { type: string, minLength: 1, maxLength: 100 }
        emptyMessage: { type: string, minLength: 1, maxLength: 500 }
        emptyAddLabel: { type: string, minLength: 1, maxLength: 180 }
    SiteSpec:
      type: object
      required: [label, value]
      properties:
        label: { type: string, minLength: 1, maxLength: 160 }
        value: { type: string, minLength: 1, maxLength: 240 }
    SiteDetails:
      type: object
      required: [eyebrow, titleLead, titleEmphasis, text, specs]
      properties:
        eyebrow: { type: string, minLength: 1, maxLength: 160 }
        titleLead: { type: string, minLength: 1, maxLength: 120 }
        titleEmphasis: { type: string, minLength: 1, maxLength: 120 }
        text: { type: string, minLength: 1, maxLength: 700 }
        specs:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/SiteSpec"
    SiteFooter:
      type: object
      required: [description, navigationTitle, catalogLink, storyLink, detailsLink, socialTitle, socialHandle, bottomSlogan]
      properties:
        description: { type: string, minLength: 1, maxLength: 400 }
        navigationTitle: { type: string, minLength: 1, maxLength: 100 }
        catalogLink: { type: string, minLength: 1, maxLength: 120 }
        storyLink: { type: string, minLength: 1, maxLength: 120 }
        detailsLink: { type: string, minLength: 1, maxLength: 160 }
        socialTitle: { type: string, minLength: 1, maxLength: 100 }
        socialHandle: { type: string, minLength: 1, maxLength: 120 }
        bottomSlogan: { type: string, minLength: 1, maxLength: 240 }
    OrderInput:
      type: object
      required: [productId, name, phone, email]
      properties:
        productId:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          minLength: 7
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 254
    OrderReceipt:
      type: object
      required: [id]
      properties:
        id:
          type: integer
    Order:
      type: object
      required: [id, productName, name, phone, email, createdAt]
      properties:
        id:
          type: integer
        productName:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time

