openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Public catalog and owner product management.
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /owner/status:
    get:
      operationId: getOwnerStatus
      summary: Check the authenticated account's owner access
      responses:
        "200":
          description: Access status (no private account information)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerStatus"
  /orders:
    post:
      operationId: createOrder
      summary: Submit a product enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Enquiry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderReceipt"
        "400":
          description: Invalid enquiry
        "404":
          description: Product not available
    get:
      operationId: listOrders
      summary: Owner-only enquiry inbox
      responses:
        "200":
          description: Received enquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Sign in required
        "403":
          description: Owner only
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List catalog products
      responses:
        "200":
          description: Catalog products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a catalog product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a catalog product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a catalog product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Product deleted
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve a catalog image
      parameters:
        - name: objectPath
          in: path
          required: true
          description: Relative path after /objects/, for example uploads/UUID. Do not pass the full normalized database path returned by upload creation.
          schema:
            type: string
            pattern: '^uploads/[0-9a-fA-F-]{36}$'
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, name, subtitle, price, kind, images, available]
      properties:
        available:
          type: boolean
        id:
          type: integer
        name:
          type: string
        subtitle:
          type: string
        price:
          type: string
        kind:
          type: string
        images:
          type: array
          maxItems: 10
          items:
            type: string
    ProductInput:
      type: object
      required: [name, subtitle, price, kind, images, available]
      properties:
        available:
          type: boolean
        name:
          type: string
          minLength: 1
        subtitle:
          type: string
          minLength: 1
        price:
          type: string
          minLength: 1
        kind:
          type: string
          minLength: 1
        images:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1
    ProductUpdate:
      type: object
      properties:
        available:
          type: boolean
        name:
          type: string
          minLength: 1
        subtitle:
          type: string
          minLength: 1
        price:
          type: string
          minLength: 1
        kind:
          type: string
          minLength: 1
        images:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
          maximum: 10485760
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
          description: Normalized database path /objects/uploads/UUID. Fetch by prepending /api/storage to this full value, or remove /objects/ before passing it to getStorageObject.
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    OwnerStatus:
      type: object
      required: [signedIn, isOwner]
      properties:
        signedIn:
          type: boolean
        isOwner:
          type: boolean
    OrderInput:
      type: object
      required: [productId, name, phone, email]
      properties:
        productId:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          minLength: 7
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 254
    OrderReceipt:
      type: object
      required: [id]
      properties:
        id:
          type: integer
    Order:
      type: object
      required: [id, productName, name, phone, email, createdAt]
      properties:
        id:
          type: integer
        productName:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time

