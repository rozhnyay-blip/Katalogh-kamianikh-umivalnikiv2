name: Deploy SKALA redirect to GitHub Pages

on:
  push:
    branches:
      - replit-agent
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare redirect page and fallback assets
        run: |
          mkdir -p _site/artifacts/stone-washbasins/public/images
          cp index.html _site/index.html
          cp artifacts/stone-washbasins/public/favicon.svg _site/artifacts/stone-washbasins/public/
          cp artifacts/stone-washbasins/public/images/hero-basin.webp _site/artifacts/stone-washbasins/public/images/
          touch _site/.nojekyll
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
