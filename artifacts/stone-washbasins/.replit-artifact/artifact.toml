kind = "web"
previewPath = "/"
title = "SKALA — Kamenné umývadlá"
description = "Slovenský katalóg kamenných umývadiel s fotografiami, dopytmi a súkromnou správou produktov pre majiteľa."
version = "1.0.0"
id = "artifacts/stone-washbasins"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22429

[services.development]
run = "pnpm --filter @workspace/stone-washbasins run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stone-washbasins", "run", "build" ]
serve = "static"
publicDir = "artifacts/stone-washbasins/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22429"
BASE_PATH = "/"
